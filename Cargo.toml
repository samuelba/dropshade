[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/samuelba/dropshade"
authors = ["Samuel Bachmann <samuel.bachmann@gmail.com>"]

[workspace.dependencies]
dropshade-term = { path = "crates/dropshade-term" }
dropshade-config = { path = "crates/dropshade-config" }
dropshade-session = { path = "crates/dropshade-session" }
alacritty_terminal = "0.26"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "svg", "advanced", "wayland", "x11", "web-colors"] }
iced_graphics = "0.14"
anyhow = "1"
open = "5"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
directories = "6"
notify = "8"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["process", "term", "poll"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
