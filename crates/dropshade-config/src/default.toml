# Dropshade configuration
# Location: ~/.config/dropshade/config.toml. Changes apply as soon as the file is saved.
# Every setting is optional; the values below are the defaults.

[font]
# An installed font family, or "monospace" for the system's default monospace font.
family = "monospace"
size = 15.0
# Line height as a multiple of the font size.
line_height = 1.25

[appearance]
# Built-in: "dusk" (dark), "dawn" (light). Any Alacritty theme file placed in
# ~/.config/dropshade/themes/<name>.toml can be used by its name.
# To follow the system's light/dark setting: theme = { dark = "dusk", light = "dawn" }
theme = "dusk"
# 0.0 (fully transparent) to 1.0 (opaque).
background_opacity = 0.94
# Space around the terminal, in pixels.
padding = 10.0
# Where the tabs are: "top", "bottom", "left" or "right".
tab_bar = "top"
# Tab width in a top or bottom bar: "fixed" (all tabs equally wide) or "fit" (each tab as
# wide as its name, up to the same maximum).
tab_width = "fixed"
# "block", "beam" or "underline". Applications can still change it.
cursor_shape = "block"
cursor_blink = false
# Overlay scrollbar at the right edge, shown once there is scrollback.
scrollbar = true

# [colors]
# Change single colors on top of the theme, in the same layout as an Alacritty theme. Only the
# colors set here are replaced; the rest come from the theme. Colors are "#rrggbb".
# [colors.primary]
# foreground = "#d6dbe4"
# background = "#16181d"
# [colors.cursor]
# cursor = "#f2a65a"          # the accent: cursor, buttons, sliders, tabs
# text = "#16181d"            # text under a block cursor; unset uses the background
# [colors.selection]
# text = "#16181d"            # unset: selections swap the text and background colors
# background = "#d6dbe4"
# [colors.normal]             # black, red, green, yellow, blue, magenta, cyan, white
# red = "#ef6b73"
# [colors.bright]             # the same names
# red = "#ff8a91"

[terminal]
# Program to run; empty means your login shell.
shell = ""
shell_args = []
# Lines kept for scrolling back, or "unlimited" (kept in memory, so it can grow large).
scrollback = 10000
# Directory for the first tab; empty means your home directory.
working_directory = ""

[terminal.env]
# Extra environment variables, e.g. EDITOR = "nvim"

[input]
# Sent for Shift+Enter unless the application uses the kitty keyboard protocol (Claude Code
# does, and then gets Shift+Enter directly). Empty sends a plain Enter.
shift_enter = "\u001b\r"
# Input methods for composed and CJK text.
ime = true
# Also copy selected text to the clipboard (it always goes to the primary selection).
copy_on_select = false

[window]
# How the terminal drops down. Dropshade applies these on desktops with layer shell (COSMIC,
# KDE Plasma, Sway, Hyprland, ...), the GNOME Shell extension on GNOME, on the next show.
# Global shortcut in GNOME accelerator syntax, e.g. "F12", "<Super>grave", "<Control><Alt>t".
# Applied on GNOME, on COSMIC (in COSMIC's custom shortcuts) and on desktops whose portal offers
# global shortcuts, such as KDE Plasma and Hyprland (while Dropshade runs). Elsewhere, bind
# "dropshade toggle" to a key in the desktop's keyboard settings.
hotkey = "F12"
# Size as a fraction of the monitor's work area (the screen minus the top bar).
width = 1.0
height = 0.5
# Where a window narrower than the screen sits: "left", "center" or "right".
align = "center"
# The screen to drop down on: "pointer" (the one under the mouse), "primary", a model such as
# "DELL U2413" or a connector such as "DP-1". A list is tried in order and the first connected
# screen wins, e.g. ["LEN P27h-10", "DELL U2719DC", "eDP-1", "pointer"] for office, home and
# laptop. Outside GNOME, "pointer" and "primary" both mean the screen the compositor picks,
# usually the focused one.
monitor = "pointer"
# Slide animation in milliseconds; 0 turns it off.
animation_duration = 180
# Hide the terminal when you click into another window.
hide_on_unfocus = false

[session]
# Reopen the tabs (their names and directories) that were open when Dropshade last quit.
restore = true
# Always start with this layout from ~/.config/dropshade/layouts/<name>.toml instead.
# Save the current tabs as a layout with: dropshade layout save <name>
layout = ""

[updates]
# Ask GitHub for the latest release on start; a newer one is announced with a notification
# and a download link in About Dropshade.
check = true

[notifications]
# Flash the terminal briefly when it rings the bell, e.g. on an ambiguous tab completion.
visual_bell = false
# Mark background tabs that rang the bell.
bell_indicator = true
# Mark background tabs that printed output.
activity_indicator = false
# Send a desktop notification when a command that ran for at least command_min_duration
# seconds finishes while Dropshade is hidden or unfocused.
command_finished = true
command_min_duration = 10

[keybindings]
# Override or add shortcuts. Values are action names, "none" to pass the key to the terminal,
# or { send = "text" } to type text. Examples:
# "ctrl+shift+t" = "new-tab"
# "ctrl+alt+l" = { send = "clear\r" }
# "ctrl+tab" = "none"
#
# Actions: copy, paste, paste-primary, new-tab, close-tab, next-tab, previous-tab,
# move-tab-left, move-tab-right, rename-tab, go-to-tab-1 … go-to-tab-9,
# scroll-page-up, scroll-page-down, scroll-to-top, scroll-to-bottom, toggle-maximize
