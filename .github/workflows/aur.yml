name: AUR

# Publishes packaging/arch/*/PKGBUILD to the AUR. The release workflow calls this after the
# packages are uploaded; run it by hand to republish, e.g. after bumping pkgrel. Without the
# AUR_SSH_PRIVATE_KEY secret it does nothing.
on:
  workflow_call:
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
  workflow_dispatch:

env:
  # Published on https://aur.archlinux.org/
  AUR_HOST_FINGERPRINT: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so nothing was published to the AUR."
      - if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/checkout@v7
      - if: env.AUR_SSH_PRIVATE_KEY != ''
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
      - name: Set up SSH for the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          useradd --create-home builder
          ssh_dir=/home/builder/.ssh
          install -d -m 700 "$ssh_dir"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts"
          ssh-keygen -lf "$ssh_dir/known_hosts" | grep -qF " $AUR_HOST_FINGERPRINT " \
            || { echo "::error::aur.archlinux.org's host key does not match"; exit 1; }
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > "$ssh_dir/config"
          chmod 600 "$ssh_dir/aur"
          chown -R builder:builder "$ssh_dir" .
      # makepkg refuses to run as root.
      - name: Publish
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: runuser -u builder -- ./scripts/aur-publish.sh
