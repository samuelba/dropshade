name: Packages

# Builds every release artifact, so packaging breaks show up before a release. The release
# workflow calls this one and uploads the results.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/dropshade/Cargo.toml
      - gnome-extension/**
      - packaging/**
      - scripts/package.sh
      - scripts/package-arch.sh
      - .github/workflows/packages.yml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: packages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low, so the binaries run on older distributions.
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sudo apt-get update && sudo apt-get install -y zip libxkbcommon-dev libwayland-client0 libwayland-cursor0 dpkg-dev
      - name: Fetch linuxdeploy
        run: |
          curl -fsSLo "$RUNNER_TEMP/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy"
      - run: ./scripts/package.sh
        env:
          LINUXDEPLOY: ${{ runner.temp }}/linuxdeploy
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Repackages the x86_64 tarball as a pacman package, so Arch ships the same binary.
  archlinux:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: packages-x86_64
          path: dist
      - run: pacman -Syu --noconfirm --needed namcap
      # makepkg refuses to run as root.
      - run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- ./scripts/package-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages-archlinux-x86_64
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS-archlinux-*
          if-no-files-found: error
